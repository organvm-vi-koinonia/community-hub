name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: koinonia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/koinonia_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install uv==0.12.15
      - run: uv sync --locked --extra dev
      - name: Run Alembic migrations
        run: |
          git clone --depth 1 https://github.com/organvm-vi-koinonia/koinonia-db.git ../koinonia-db
          cd ../koinonia-db && "$GITHUB_WORKSPACE/.venv/bin/alembic" upgrade head
      - name: Type check with pyright
        run: uv run pyright src/
      - run: uv run pytest tests/ -v
      - run: uv run ruff check src/ tests/
